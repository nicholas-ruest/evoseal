[workspace]
members = [
  "crates/evoseal-domain",
  "crates/evoseal-application",
  "crates/evoseal-adapter-rrsi",
  "crates/evoseal-adapter-ruvnet",
  "crates/evoseal-cli",
  "crates/evoseal-evaluation",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nicholas-ruest/evoseal"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.48", features = ["derive"] }
hex = "=0.4.3"
ruvector-core = { version = "=2.3.1", default-features = false, features = ["storage", "hnsw"] }
rvf-crypto = "=0.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
thiserror = "=2.0.17"
wait-timeout = "=0.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

